<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Apo Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fond image — remplace src par ton jpg dans assets/ -->
  <img class="bg-image" src="assets/wallpaper.jpg" alt="" />
  <div class="bg-overlay"></div>
  <canvas class="particles-canvas" id="particles-canvas"></canvas>

  <!-- Musique de fond — démarrée au premier clic (contrainte navigateur) -->
  <audio id="bg-music" loop>
    <source src="assets/theme.mp3" type="audio/mpeg">
  </audio>

  <!-- Barre de titre custom (fenêtre sans bordure) -->
  <div class="titlebar" id="titlebar">
    <button class="mute-btn" id="mute-btn" title="Couper le son">
      <img src="assets/cd-icon.png" alt="" class="mute-icon" />
    </button>
    <div class="spacer"></div>
    <button class="win-btn" id="minimize-btn">─</button>
    <button class="win-btn close" id="close-btn">✕</button>
  </div>

  <div class="app">
    <div class="logo">Apo Launcher</div>

    <div class="glass-panel">
      <nav class="nav">
        <button class="nav-item active" data-screen="connexion">Connexion</button>
        <button class="nav-item" data-screen="play">Play</button>
        <button class="nav-item" data-screen="settings">Paramètres</button>
      </nav>

      <!-- Écran Connexion -->
      <section class="screen active" id="screen-connexion">
        <p class="panel-title">Pseudo</p>
        <input class="field" type="text" id="username-input" placeholder="Ton pseudo Minecraft" maxlength="16" />
        <p class="hint">Attention à l'identifiant de la whitelist du serveur.</p>
        <div class="btn-row">
          <button class="btn primary" id="save-username-btn">Valider</button>
        </div>
      </section>

      <!-- Écran Play -->
      <section class="screen" id="screen-play">
        <p class="panel-title">Serveur</p>
        <div class="server-list" id="server-list">
          <!-- rempli dynamiquement en JS, une carte par serveur -->
        </div>
        <button class="server-add-btn" id="add-server-btn">+ Ajouter un serveur</button>

        <div class="server-status" id="server-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Vérification du serveur…</span>
        </div>
        <div class="status-details" id="status-details"></div>

        <div class="btn-row" style="margin-top:20px;">
          <button class="btn primary" id="play-btn">Jouer</button>
        </div>
        <p class="hint" id="launch-progress"></p>
      </section>

      <!-- Écran Paramètres -->
      <section class="screen" id="screen-settings">
        <p class="panel-title">Mémoire allouée (RAM)</p>
        <div class="ram-row">
          <input type="range" id="ram-slider" min="2048" max="16384" step="512" />
          <span id="ram-value">4096 Mo</span>
        </div>
        <div class="btn-row" style="margin-top:20px;">
          <button class="btn" id="save-settings-btn">Enregistrer</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Modal générique (modifier l'IP d'un serveur / en ajouter un) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="glass-panel modal">
      <p class="panel-title" id="modal-title">Modifier le serveur</p>
      <div id="modal-fields"></div>
      <div class="btn-row">
        <button class="btn" id="modal-cancel-btn">Annuler</button>
        <button class="btn primary" id="modal-save-btn">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="particles.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
