<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Apo Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fond image — remplace src par ton jpg dans assets/ -->
  <img class="bg-image" src="assets/wallpaper.jpg" alt="" />
  <div class="bg-overlay"></div>
  <canvas class="particles-canvas" id="particles-canvas"></canvas>

  <!-- Musique de fond — démarrée au premier clic (contrainte navigateur) -->
  <audio id="bg-music" loop>
    <source src="assets/theme.mp3" type="audio/mpeg">
  </audio>

  <!-- Barre de titre custom (fenêtre sans bordure) -->
  <div class="titlebar" id="titlebar">
    <button class="mute-btn" id="mute-btn" data-i18n-title="mute.mute">
      <img src="assets/cd-icon.png" alt="" class="mute-icon" />
    </button>
    <div class="spacer"></div>
    <button class="win-btn" id="minimize-btn">─</button>
    <button class="win-btn close" id="close-btn">✕</button>
  </div>

  <div class="app">
    <div class="logo">Apo Launcher</div>

    <div class="glass-panel">
      <nav class="nav">
        <button class="nav-item active" data-screen="connexion" data-i18n="nav.connexion">Connexion</button>
        <button class="nav-item" data-screen="play" data-i18n="nav.play">Play</button>
        <button class="nav-item" data-screen="settings" data-i18n="nav.settings">Paramètres</button>
      </nav>

      <!-- Écran Connexion -->
      <section class="screen active" id="screen-connexion">
        <div id="ms-account-connected" hidden>
          <p class="panel-title" data-i18n="connexion.msConnectedAs">Connecté avec Microsoft</p>
          <p class="hint" id="ms-account-name"></p>
          <div class="btn-row">
            <button class="btn primary" id="ms-continue-btn" data-i18n="connexion.validate">Valider</button>
          </div>
          <div class="btn-row" style="margin-top:10px;">
            <button class="btn" id="ms-logout-btn" data-i18n="connexion.msLogout">Se déconnecter</button>
          </div>
        </div>

        <div id="ms-account-disconnected">
          <p class="panel-title" data-i18n="connexion.pseudoLabel">Pseudo</p>
          <input class="field" type="text" id="username-input" data-i18n-placeholder="connexion.pseudoPlaceholder" placeholder="Ton pseudo Minecraft" maxlength="16" />
          <p class="hint" data-i18n="connexion.hint">Attention à l'identifiant de la whitelist du serveur.</p>
          <div class="btn-row">
            <button class="btn primary" id="save-username-btn" data-i18n="connexion.validate">Valider</button>
          </div>
          <div class="btn-row" style="margin-top:10px;">
            <button class="btn" id="ms-login-btn" data-i18n="connexion.msLogin">Se connecter avec Microsoft</button>
          </div>
          <p class="hint" id="ms-login-status"></p>
        </div>

        <div class="news-ticker" id="news-ticker">
          <div class="news-ticker-track" id="news-ticker-track"></div>
        </div>
      </section>

      <!-- Écran Play -->
      <section class="screen" id="screen-play">
        <p class="panel-title" data-i18n="play.serverLabel">Serveur</p>
        <div class="server-list" id="server-list">
          <!-- rempli dynamiquement en JS, une carte par serveur -->
        </div>
        <button class="server-add-btn" id="add-server-btn" data-i18n="play.addServer">+ Ajouter un serveur</button>

        <div class="server-status-row">
          <div>
            <div class="server-status" id="server-status">
              <span class="status-dot" id="status-dot"></span>
              <span id="status-text" data-i18n="status.checking">Vérification du serveur…</span>
            </div>
            <div class="status-details" id="status-details"></div>
          </div>
          <div class="addon-buttons">
            <button class="btn addon-btn" id="mods-btn" data-i18n="addons.mods">Mods</button>
            <button class="btn addon-btn" id="shaders-btn" data-i18n="addons.shaders">Shaders</button>
          </div>
        </div>

        <div class="btn-row" style="margin-top:20px;">
          <button class="btn primary" id="play-btn" data-i18n="play.play">Jouer</button>
          <button class="btn" id="retry-launch-btn" data-i18n="play.retry" hidden>Réessayer</button>
        </div>
        <p class="hint" id="launch-progress"></p>
      </section>

      <!-- Écran Paramètres -->
      <section class="screen" id="screen-settings">
        <p class="panel-title" data-i18n="settings.ram">Mémoire allouée (RAM)</p>
        <div class="ram-row">
          <input type="range" id="ram-slider" min="2048" max="16384" step="512" />
          <span id="ram-value">4096 Mo</span>
        </div>
        <p class="hint" id="ram-suggestion"></p>

        <p class="panel-title" style="margin-top:20px;" data-i18n="settings.volume">Volume musique</p>
        <div class="ram-row">
          <input type="range" id="volume-slider" min="0" max="100" step="5" />
          <span id="volume-value">10 %</span>
        </div>

        <div class="btn-row" style="margin-top:20px;">
          <button class="btn" id="save-settings-btn" data-i18n="settings.save">Enregistrer</button>
        </div>

        <div class="btn-row" style="margin-top:10px;">
          <button class="btn" id="open-folder-btn" data-i18n="settings.openFolder">Ouvrir le dossier du jeu</button>
          <button class="btn" id="copy-logs-btn" data-i18n="settings.copyLogs">Copier les logs</button>
        </div>
        <p class="hint" id="copy-logs-status"></p>

        <div class="btn-row" style="margin-top:10px;">
          <button class="btn" id="check-updates-btn" data-i18n="settings.checkUpdates">Vérifier les mises à jour</button>
          <button class="btn primary" id="update-action-btn" hidden></button>
        </div>
        <p class="hint" id="update-status"></p>
      </section>
    </div>
  </div>

  <!-- Modal générique (modifier l'IP d'un serveur / en ajouter un) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="glass-panel modal">
      <p class="panel-title" id="modal-title" data-i18n="modal.defaultTitle">Modifier le serveur</p>
      <div id="modal-fields"></div>
      <div class="btn-row">
        <button class="btn" id="modal-cancel-btn" data-i18n="modal.cancel">Annuler</button>
        <button class="btn primary" id="modal-save-btn" data-i18n="modal.save">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="app-version" id="app-version"></div>

  <!-- Icône "joueur" en bas à gauche : c'est l'aperçu 3D du skin actuel en
       permanence (pas une icône générique) — cliquer ouvre l'éditeur de
       skin en plein écran, le même personnage y réapparaît en grand. -->
  <button class="skin-fab" id="skin-fab" data-i18n-title="skin.title" title="Skin">
    <canvas id="skin-mini-canvas" width="40" height="56"></canvas>
  </button>

  <!-- Éditeur de skin — plein écran (sous la titlebar), séparé du reste de
       la nav pour laisser toute la place à l'aperçu 3D + aux galeries. -->
  <div class="skin-editor-overlay" id="skin-editor-overlay">
    <button class="skin-editor-close" id="skin-editor-close">✕</button>
    <div class="skin-editor-left">
      <div class="skin-preview-frame">
        <canvas id="skin-3d-canvas" width="240" height="330"></canvas>
        <button class="skin-action-icon skin-favorite-btn" id="skin-favorite-btn" data-i18n-title="skin.favorite" title="Favori" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.4-4.7 7.1-.6z"/></svg>
        </button>
        <button class="skin-action-icon skin-apply-btn" id="skin-apply-btn" data-i18n-title="skin.apply" title="Utiliser ce skin" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="skin-editor-right">
      <p class="panel-title" data-i18n="skin.title">Skin</p>
      <div class="skin-3d-controls">
        <input class="field" type="text" id="skin-search-input" data-i18n-placeholder="skin.searchPlaceholder" placeholder="Pseudo Minecraft (ex: Notch)" maxlength="16" />
        <button class="skin-namemc-btn" id="skin-namemc-btn" data-i18n-title="skin.browseNamemc" title="Chercher un skin sur NameMC">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="hint" id="skin-status"></p>

      <p class="panel-title" style="margin-top:18px;" data-i18n="skin.favoritesTitle">Favoris</p>
      <div class="skin-gallery" id="skin-favorites-grid"></div>
    </div>
  </div>

  <!-- Navigateur NameMC intégré — menu à part, ouvert depuis l'éditeur de
       skin. Sert juste à parcourir/copier un pseudo soi-même (pas de
       scraping/curation de notre côté : on affiche leur site tel quel,
       comme un onglet de navigateur classique). -->
  <div class="namemc-overlay" id="namemc-overlay">
    <div class="namemc-topbar">
      <span data-i18n="skin.browseNamemc">Chercher un skin sur NameMC</span>
      <button class="namemc-close-btn" id="namemc-close" data-i18n="changelog.close">Fermer</button>
    </div>
    <webview id="namemc-webview" src="https://fr.namemc.com/minecraft-skins" allowpopups></webview>
  </div>

  <!-- Emoji drapeaux non fiables sous Windows (rendus en texte "GB"/"FR") —
       vrais SVG à la place, garantis de s'afficher partout. -->
  <div class="lang-toggle" id="lang-toggle">
    <button class="lang-flag-btn" data-lang="en" title="English">
      <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg">
        <rect width="60" height="30" fill="#00247d"/>
        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/>
        <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
        <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/>
      </svg>
    </button>
    <button class="lang-flag-btn" data-lang="fr" title="Français">
      <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg">
        <rect width="1" height="2" x="0" fill="#0055A4"/>
        <rect width="1" height="2" x="1" fill="#FFFFFF"/>
        <rect width="1" height="2" x="2" fill="#EF4135"/>
      </svg>
    </button>
  </div>

  <script src="i18n.js"></script>
  <script src="particles.js"></script>
  <script src="../node_modules/skinview3d/bundles/skinview3d.bundle.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
